<!DOCTYPE html>
<html lang="fa">
<head>
    <title>Offline</title>
	<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale= 1" />
    <style>
        @font-face {
            font-family: "Biransans";
            src: url("/resource/fonts/IRANSans-Bold-web.eot") format("eot"), url("/resource/fonts/IRANSans-Bold-web.woff") format("woff"), url("/resource/fonts/IRANSans-Bold-web.ttf") format("truetype");
        }

        @font-face {
            font-family: "Liransans";
            src: url("/resource/fonts/IRANSans-Light-web.eot") format("eot"), url("/resource/fonts/IRANSans-Light-web.woff") format("woff"), url("/resource/fonts/IRANSans-Light-web.ttf") format("truetype");
        }

        @font-face {
            font-family: "Miransans";
            src: url("/resource/fonts/IRANSans-Medium-web.eot") format("eot"), url("/resource/fonts/IRANSans-Medium-web.woff") format("woff"), url("/resource/fonts/IRANSans-Medium-web.ttf") format("truetype");
        }

        @font-face {
            font-family: "ULiransans";
            src: url("/resource/fonts/IRANSans-UltraLight-web.eot") format("eot"), url("/resource/fonts/IRANSans-UltraLight-web.woff") format("woff"), url("/resource/fonts/IRANSans-UltraLight-web.ttf") format("truetype");
        }
        html {
            width:100%; 
            height:100%; 
            background-color:#242424;
            text-align: center;
        }
        .message-container {
            margin: 10px;
            background-color: white;
            border-radius: 4px;
            display: flex;
            flex-flow: column;
            padding: 5px;
        }
        .title {
            font: 15px Biransans;
            text-align: center;
            padding: 5px;
        }
        .message {
            font: 13px Miransans;
            text-align: right;
            direction: rtl;
            padding: 5px;
        }
        .button {
            margin: auto;
            padding: 5px;
            font: 13px Miransans;
            color:#242424;
            background-color: #fdd835;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img src="/resource/img/amlakbashi-logo-680w.gif" width="106" height="47"/>
    <div class="message-container">
        <div class="title">عدم اتصال به اینترنت</div>
        <div class="message">اتصال اینترنت شما قطع شده است. برای استفاده از خدمات املاک باشی به اینترنت متصل شوید</div>
        <div onclick="retry()" class="button" href="/">تلاش مجدد</div>
    </div>
    <script type="text/javascript">
        function retry() {
            if (navigator.onLine) {
                window.location.href = "/";
            }
        }
    </script>
</body>
</html>
